name: Atualizar artes premium (temporário)
on:
  push:
    paths: ['.github/workflows/update-premium-art.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Baixar, otimizar e substituir artes
        env:
          URL_SPLASH: 'https://at.adobe.com/an45ukge4et0TXXe'
          URL_NILO: 'https://at.adobe.com/Bfu8GFXzRKNUD7e3'
          URL_CHEST: 'https://at.adobe.com/tiQ4QdAgcMdpDPS7'
          URL_BEACH: 'https://at.adobe.com/SCT26acN1NNjfhTi'
          URL_FOREST: 'https://at.adobe.com/oyMfNwRSnf7yNhnN'
          URL_CANDY: 'https://at.adobe.com/sDgFoCZn7DzNBnvA'
        run: |
          python - <<'PY'
          import os, urllib.request, io
          from pathlib import Path
          from PIL import Image, ImageOps
          specs = [
            ('splash', 760),
            ('nilo', 610),
            ('chest', 600),
            ('beach', 1080),
            ('forest', 1080),
            ('candy', 1080),
          ]
          out = Path('assets/artwork')
          out.mkdir(parents=True,exist_ok=True)
          for name,max_width in specs:
              request=urllib.request.Request(os.environ['URL_'+name.upper()],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  data=response.read()
              if not data.startswith(b'\x89PNG'):
                  raise RuntimeError(f'Invalid PNG for {name}: {data[:80]!r}')
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(data)))
              if im.width>max_width:
                  im=im.resize((max_width,round(im.height*max_width/im.width)),Image.Resampling.LANCZOS)
              im=im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              dest=out/(name+'.webp')
              im.save(dest,'WEBP',quality=83,method=6)
              with Image.open(dest) as check:
                  check.verify()
              print(f'{name}: {dest.stat().st_size} bytes')
          assert len(specs)==6
          PY
      - name: Commit das artes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artwork/*.webp
          git commit -m "art: substitui seis imagens pelas versões premium" 
          git push origin HEAD:main
