name: Deploy Expedição Tabuada
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar JavaScript do jogo
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<script>' in html and '</script>' in html
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/expedicao-tabuada.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/expedicao-tabuada.js
          node --check assets/rewards.js
          node tests/rewards.test.js
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          svg=Path('assets/atlas-scenes.svg')
          ET.parse(svg)
          root=ET.parse(svg).getroot()
          ns='{http://www.w3.org/2000/svg}'
          ids={el.attrib.get('id') for el in root.iter() if el.attrib.get('id')}
          for n in range(12): assert 'scene-'+str(n) in ids
          assert {'mascot-nilo','treasure-chest'}.issubset(ids)
          html=Path('index.html').read_text(encoding='utf-8')
          for path in ['assets/rewards.js','assets/adventure.css','assets/atlas-scenes.svg']:
              assert Path(path).is_file()
              assert path in html
          print('✓ SVG válido, 12 paisagens e dependências do HTML encontradas')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
