name: Webapp · Converter primeiro lote
on:
  push:
    branches: [feature/webapp-modular]
    paths:
      - .github/workflows/webapp-import-001.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: feature/webapp-modular
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install pillow
      - name: Comprimir somente os 14 assets de HOME
        run: python webapp/tools/convert-batch.py webapp/data/batches/001-home.json
      - name: Atualizar inventário
        run: node webapp/tools/apply-batch-to-inventory.mjs webapp/data/batches/001-home-results.json
      - name: Validar arquivos e estrutura
        run: |
          cd webapp
          npm run check
      - name: Versionar lote e relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/assets/optimized/ webapp/data/asset-inventory.csv webapp/data/batches/001-home-results.json
          git diff --cached --quiet && exit 0
          git commit -m "assets(home): importa 14 recursos em WebP e registra relatorio"
          git push origin HEAD:feature/webapp-modular
