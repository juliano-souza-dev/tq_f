name: Importar artes do Atlas (temporário)
on:
  push:
    paths: ['.github/workflows/import-artwork.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Dependências
        run: python -m pip install --disable-pip-version-check pillow
      - name: Converter as seis artes em WebP
        env:
          URL_SPLASH: 'https://at.adobe.com/eMHin1V2T6HtZO9b'
          URL_NILO: 'https://at.adobe.com/T4zdhoaepAlsC1gx'
          URL_CHEST: 'https://at.adobe.com/b6CMbmlpy6Ne2Kiu'
          URL_FOREST: 'https://at.adobe.com/KuReQroVNoSIehrb'
          URL_BEACH: 'https://at.adobe.com/aDHJZi25KoIhRDCJ'
          URL_CANDY: 'https://at.adobe.com/0crMtUK7l8lYYO3i'
        run: |
          python - <<'PY'
          import os, urllib.request, io
          from pathlib import Path
          from PIL import Image, ImageOps
          entries = [
            ('splash', 'SPLASH', 760),
            ('nilo', 'NILO', 610),
            ('chest', 'CHEST', 600),
            ('forest', 'FOREST', 1080),
            ('beach', 'BEACH', 1080),
            ('candy', 'CANDY', 1080),
          ]
          output = Path('assets/artwork')
          output.mkdir(parents=True, exist_ok=True)
          for filename, envkey, width in entries:
              req = urllib.request.Request(os.environ['URL_'+envkey], headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=80) as response:
                  content = response.read()
              if not content.startswith(b'\x89PNG'):
                  raise RuntimeError(f'{filename}: conteúdo inesperado, não PNG ({len(content)} bytes, {content[:48]!r})')
              img = Image.open(io.BytesIO(content))
              img = ImageOps.exif_transpose(img)
              if img.width > width:
                  height = round(img.height * width / img.width)
                  img = img.resize((width, height), Image.Resampling.LANCZOS)
              if img.mode not in ('RGB','RGBA'):
                  img = img.convert('RGBA')
              path = output / (filename + '.webp')
              img.save(path, 'WEBP', quality=78, method=6)
              check = Image.open(path)
              check.verify()
              print(f'{filename}: {path.stat().st_size} bytes')
          assert len(list(output.glob('*.webp'))) == 6
          PY
      - name: Adicionar artes ao repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artwork/*.webp
          git commit -m "art: adiciona seis imagens originais otimizadas para mobile"
          git push origin HEAD:main
