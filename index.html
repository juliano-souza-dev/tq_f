.chapter-story{margin-top:18px;padding:22px 25px 24px;background:linear-gradient(145deg,#13334d,#17495a);border:1px solid #4b8290;border-radius:24px;box-shadow:var(--shadow)}.chapter-story>p{max-width:760px;color:#f0f1e4;font-size:1.02rem;line-height:1.7;margin:12px 0 15px}.chapter-story-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.chapter-tag{background:#ebd99e;color:#374739;padding:5px 10px;border-radius:99px;font-size:.77rem;font-weight:900}.character-talk,.story-quote,.victory-story{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid #52788e;background:#092b44a9;border-radius:17px;padding:13px 15px}.character-face{width:55px;height:55px;min-width:55px;display:grid;place-items:center;border-radius:16px;background:#e7d8a7;color:#153744;font-size:1.9rem}.character-talk b,.story-quote b,.victory-story b{font-size:.87rem}.character-talk p,.story-quote p,.victory-story p{color:#e1f1ed;margin:3px 0 0;font-size:.9rem;line-height:1.46}.chapter-outro{background:#364e49;border:1px solid #9ab67b;border-radius:15px;margin-top:13px;padding:13px 15px}.chapter-outro>b{color:#e7ecad}.chapter-outro p{margin:6px 0 0;color:#f4f1e4}
.story-canvas,.mission-story{max-width:850px;margin:auto;background:radial-gradient(circle at 80% 0%,#2c7786 0,transparent 45%),linear-gradient(155deg,#164765,#102c47);border:1px solid #598996;border-radius:28px;padding:clamp(22px,5vw,50px);box-shadow:var(--shadow)}.story-canvas h1,.mission-story h1{font-size:clamp(2rem,4.3vw,3.8rem);margin:15px 0}.story-canvas>p,.mission-story>p{font-size:1.05rem;color:#e4f2ec;line-height:1.75}.prologue-art{display:flex;justify-content:center;align-items:center;min-height:150px;font-size:5.5rem;text-shadow:0 12px 20px rgba(0,0,0,.2)}.prologue-art span{font-size:2.4rem;align-self:flex-start;margin-top:15px}.story-quote{margin:24px 0}.story-controls{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:24px}
.mission-header{display:flex;align-items:center;justify-content:space-between;gap:12px}.mission-symbol{display:grid;place-items:center;width:60px;height:60px;background:#f0daa6;color:#23445a;border-radius:18px;font-size:2.15rem}.mission-scene{display:flex;align-items:center;gap:23px;padding:26px 21px;margin:19px 0;background:#0a2944aa;border:1px solid #47798b;border-radius:20px}.mission-scene-icon{font-size:clamp(4rem,12vw,7rem);flex-shrink:0}.mission-scene p{margin:0;font-size:1.1rem;color:#e9f2ed;line-height:1.7}.mission-objective{display:flex;align-items:center;gap:15px;margin:18px 0;padding:17px 18px;border-radius:17px;background:#d6ecbb;color:#203e3d}.mission-objective>span{font-size:2rem}.mission-objective b{color:#1c3a3d}.mission-objective p{margin:3px 0 0;color:#294b49}.mission-story .character-talk{margin-top:16px}.mission-brief{max-width:760px;margin:14px auto;background:#174861;border:1px solid #47768a;border-radius:15px;padding:11px 18px;display:flex;align-items:center;gap:13px}.mission-brief>span{font-size:2.2rem}.mission-brief strong{display:block}.mission-brief small{display:block;color:#cde2e5;font-size:.84rem}.victory-story{margin:18px auto;max-width:720px;text-align:left}.final-chapter{background:radial-gradient(circle at 50% 0%,#476554,#163852 70%)}
.storybook-heading{background:linear-gradient(135deg,#305f67,#17374e);border:1px solid #4c7d86;padding:25px;border-radius:23px;margin-top:16px}.storybook-heading p{color:#d9edf0}.star-counter{display:flex;flex-wrap:wrap;gap:7px}.star-counter span{width:34px;height:38px;border-radius:10px;background:#13344d;color:#b9cbcf;display:grid;place-items:center;font-size:1.45rem}.star-counter span.lit{background:#49644b;color:#ffe7a4}.book-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:17px}.book-entry{display:flex;align-items:flex-start;gap:14px;border-radius:20px;border:1px solid #38647f;background:#173c58;padding:19px}.book-entry h3{font-size:1.11rem;margin:5px 0 8px}.book-entry p{font-size:.9rem;line-height:1.6;margin-bottom:14px}.book-icon{display:grid;place-items:center;width:58px;height:58px;min-width:58px;border-radius:17px;font-size:2.2rem;background:#b9d9c5;color:#204557}.book-locked{opacity:.55}
.island-grid .island-title{line-height:1.3;min-height:37px}.island-grid .island-detail{min-height:28px}
@media(max-width:1000px){.book-list{grid-template-columns:1fr}.atlas-banner{align-items:flex-start;flex-direction:column}.atlas-stars{justify-content:flex-start}}

.typed-answer{margin:22px auto 8px;max-width:540px;padding:22px;border:1px solid var(--line);border-radius:19px;background:#122f4d}.typed-answer label{display:block;margin-bottom:15px;font-weight:850;color:#f9fbfc;font-size:1.06rem}.typed-row{display:flex;gap:12px;align-items:stretch}.typed-row input{width:100%;min-width:0;border:2px solid #4a7891;background:#081d35;color:#fff;border-radius:13px;padding:15px;font-size:1.4rem;text-align:center;font-weight:850}.typed-row .btn{min-width:135px}@media(max-width:480px){.typed-row{flex-direction:column}.typed-row .btn{width:100%}}

<script>
(() => {
'use strict';
const STORE='expedicao-tabuada-v1';
const Rewards=window.TQRewards;
const REGIONS=[
 {name:'Baía das Conchas',theme:'O começo da jornada',icon:'🐚',table:1,desc:'Descubra como funciona a multiplicação.'},
 {name:'Floresta das Araras',theme:'Segredos da floresta',icon:'🦜',table:2,desc:'Atravesse a mata contando de dois em dois.'},
 {name:'Deserto Dourado',theme:'Areias do conhecimento',icon:'🏜️',table:3,desc:'Descubra os tesouros escondidos na tabuada do 3.'},
 {name:'Vale dos Dragões',theme:'Um desafio encantado',icon:'🐉',table:4,desc:'Ajude os dragões a proteger o vale.'},
 {name:'Montanhas de Cristal',theme:'Escalando números',icon:'💎',table:5,desc:'Suba as montanhas com a tabuada do 5.'},
 {name:'Pântano das Estrelas',theme:'Luzes no caminho',icon:'🌟',table:6,desc:'A cada acerto, uma estrela ilumina a noite.'},
 {name:'Vulcão Rubro',theme:'Coragem e estratégia',icon:'🌋',table:7,desc:'Resfrie o vulcão dominando a tabuada do 7.'},
 {name:'Reino de Gelo',theme:'A jornada gelada',icon:'❄️',table:8,desc:'Solucione os desafios do reino congelado.'},
 {name:'Ilhas Flutuantes',theme:'Entre as nuvens',icon:'☁️',table:9,desc:'Viaje pelo céu com a tabuada do 9.'},
 {name:'Fortaleza Pirata',theme:'O último grande número',icon:'🏴‍☠️',table:10,desc:'Encare os piratas com a tabuada do 10.'},
 {name:'Arquipélago da Memória',theme:'A grande revisão I',icon:'🧩',table:0,desc:'Relembre tudo o que aprendeu das tabuadas 1 a 5.'},
 {name:'Coroa do Mundo',theme:'A grande revisão II',icon:'🏰',table:0,desc:'Complete as tabuadas 6 a 10 e conquiste o mundo!'}
];
const ISLAND_NAMES=['Porto da Partida','Enseada dos Enigmas','Ilha dos Amigos','Baú da Coragem','Farol da Vitória'];
const ISLAND_ICONS=['⛵','🗺️','🐾','🎁','🏆'];
const CHAPTERS=[{"character":"Nilo, o cartógrafo","face":"🦉","subtitle":"A bússola que aponta para as descobertas","intro":"O Grande Atlas está perdendo as cores. A Bruma do Esquecimento apagou seus caminhos e espalhou doze estrelas pelo mundo. Nilo, uma coruja cartógrafa, encontra você na praia e entrega a primeira página do mapa.","line":"Cada descoberta acende uma trilha. Vamos começar com grupos iguais!","outro":"A primeira estrela surge dentro de uma concha gigante! Nilo desenha uma rota até uma floresta onde as araras guardam uma pista.","quests":[["O bilhete na areia","Uma garrafa traz o recado de Nilo, mas as letras só aparecem quando você resolve os primeiros enigmas.","Encontre a mensagem secreta.","O bilhete revela o símbolo da primeira estrela."],["O cais escondido","As placas do pequeno porto estão embaralhadas. O caminho correto aparece a cada multiplicação resolvida.","Reorganize as placas do cais.","O cais se acende e o barco encontra passagem."],["A amiga da maré","Uma tartaruguinha ficou presa entre redes antigas e precisa de alguém que conte as cordas.","Ajude a tartaruga a voltar ao mar.","A tartaruga se torna sua primeira amiga de viagem."],["O baú da praia","O baú de um navegador antigo tem um cadeado formado por sequências.","Abra o baú dos navegadores.","Dentro dele existe uma lupa que revela estrelas escondidas."],["O farol das conchas","O farol apagado precisa de uma última sequência de respostas para iluminar a baía.","Acenda o farol e encontre a estrela.","A primeira estrela ilumina o céu sobre a baía."]]},{"character":"Lira, a arara","face":"🦜","subtitle":"As canções da floresta","intro":"O barco alcança uma floresta que canta em duplas. Lira, uma arara falante, conta que as trilhas desaparecem quando seus habitantes esquecem as sequências de dois em dois.","line":"Escute o ritmo das folhas: de dois em dois, vamos reencontrar a música!","outro":"Quando a floresta volta a cantar, uma estrela verde aparece entre as copas. Lira mostra a direção do deserto.","quests":[["O som da entrada","Dois sinos por árvore marcam o caminho para o interior da mata.","Encontre o ritmo certo.","Os sinos dão boas-vindas à expedição."],["A ponte dos tucanos","Tucanos só atravessam a ponte quando as tábuas aparecem em pares.","Reconstrua a ponte da floresta.","A ponte ganha novas cores."],["O ninho perdido","Um filhote de arara espera ajuda para encontrar o ninho certo.","Guie o filhote entre as árvores.","O filhote se junta aos amigos encontrados."],["O templo das folhas","Símbolos brilhantes estão escondidos por trás de cipós.","Revele os símbolos do templo.","O templo aponta para a árvore mais antiga."],["A grande canção","A floresta inteira precisa cantar em harmonia para mostrar sua estrela.","Complete a canção da floresta.","A segunda estrela dança no alto das árvores."]]},{"character":"Zuri, a raposa do deserto","face":"🦊","subtitle":"Segredos guardados na areia","intro":"Sob o sol dourado, antigas pirâmides surgem e desaparecem. Zuri sabe onde estão as pistas, mas as dunas só liberam seus segredos de três em três.","line":"No deserto, pequenas pistas formam grandes descobertas.","outro":"A estrela dourada surge de uma ampulheta. Ela revela a entrada de um vale habitado por dragões gentis.","quests":[["Marcas nas dunas","Pegadas em grupos de três atravessam um campo de areia.","Siga as pegadas de Zuri.","As pegadas levam a um oásis escondido."],["Oásis dos três sóis","As palmeiras precisam de água, mas cada canal depende de um enigma.","Leve água até as palmeiras.","O oásis floresce."],["O pequeno escorpião","Um escorpião curioso perdeu a rota para casa.","Encontre uma rota segura.","O escorpião acompanha a expedição."],["A câmara dourada","Um corredor de pedras antigas protege um segredo.","Abra a câmara da pirâmide.","O corredor revela uma ampulheta mágica."],["A ampulheta estelar","A estrela só aparece quando os grãos de areia voltam a se mover.","Ative a ampulheta estelar.","A terceira estrela brilha sobre o deserto."]]},{"character":"Brasa, o dragão","face":"🐲","subtitle":"Um vale de criaturas corajosas","intro":"O vale parece assustador, mas seus dragões são guardiões do Atlas. O filhote Brasa perdeu o controle das chamas que iluminam as pontes da região.","line":"Coragem é tentar novamente, mesmo quando a resposta não vem de primeira.","outro":"As chamas do vale se transformam em uma estrela vermelha. Brasa entrega um mapa das montanhas de cristal.","quests":[["A trilha fumegante","Quatro pedras luminosas marcam cada parte do caminho.","Encontre a trilha segura.","Um novo caminho atravessa a fumaça."],["A ponte de pedra","A ponte dos dragões se separou em partes.","Una as partes da ponte.","A ponte volta a ligar as duas margens."],["O filhote Brasa","Brasa precisa reunir pedrinhas para criar uma chama azul que não queima.","Ajude Brasa a criar sua chama.","Brasa passa a torcer por você."],["A caverna dos ecos","Ecos confundem quem passa pelos túneis.","Descubra a saída da caverna.","Os ecos revelam o salão do guardião."],["A chama da amizade","A última chama iluminará o cristal guardado pelos dragões.","Acenda a chama da amizade.","A quarta estrela surge entre as chamas."]]},{"character":"Cris, a cabrinha","face":"🐐","subtitle":"Os caminhos de cristal","intro":"Picos altos refletem o céu em milhares de cristais. Cris, uma cabrinha alpinista, ensina que a subida fica mais simples quando contamos de cinco em cinco.","line":"Uma montanha não se vence em um salto, mas passo por passo.","outro":"No cume, a estrela cristalina ilumina o horizonte. O brilho revela um pântano cheio de luzes misteriosas.","quests":[["A base da montanha","Marcas de cinco em cinco orientam a subida pela encosta.","Prepare os equipamentos da subida.","A primeira trilha fica segura."],["Escada de cristais","Degraus de cristal surgem apenas quando os enigmas são resolvidos.","Forme a escada de cristais.","Os degraus levam até uma gruta."],["O resgate de Cris","Cris se perdeu em uma neblina colorida perto de uma pedra preciosa.","Encontre Cris na neblina.","Cris vira uma nova amiga da aventura."],["O espelho secreto","Uma parede de cristal reflete o mapa de cabeça para baixo.","Revele o mapa no espelho.","O mapa aponta o caminho para o pico."],["O topo brilhante","No pico mais alto, uma estrela está aprisionada no gelo de cristal.","Libere a estrela do topo.","A quinta estrela aparece sobre as nuvens."]]},{"character":"Pipo, o vaga-lume","face":"✨","subtitle":"Uma noite que precisa de luz","intro":"No Pântano das Estrelas a noite chegou cedo. Pipo, um vaga-lume brilhante, perdeu o caminho até sua família. Cada resposta ilumina uma nova parte do mapa.","line":"Mesmo uma luz pequenina pode mostrar o próximo passo.","outro":"A sexta estrela acende milhares de pontinhos no céu. Pipo mostra uma trilha aquecida que segue até o Vulcão Rubro.","quests":[["Luzes na água","Reflexos escondem o caminho entre as vitórias-régias.","Encontre a passagem iluminada.","As águas começam a refletir estrelas."],["Passarela dos juncos","Uma passarela precisa ser reconstruída com sequências de seis.","Abra a passarela dos juncos.","A travessia fica segura."],["Os amigos de Pipo","Os vaga-lumes se separaram na escuridão.","Reúna a família de Pipo.","Pipo e os amigos iluminam sua rota."],["A árvore luminosa","Uma árvore gigante guarda cristais de luz no tronco.","Ative os cristais da árvore.","A luz alcança o outro lado do pântano."],["A noite estrelada","Falta uma última centelha para iluminar a noite.","Devolva as estrelas ao céu.","A sexta estrela volta a brilhar."]]},{"character":"Téo, o salamandro","face":"🦎","subtitle":"O segredo das sete chamas","intro":"O Vulcão Rubro está soltando fagulhas por toda a região. Téo, uma salamandra engenhosa, precisa ativar sete válvulas para resfriar a montanha.","line":"Pensar com calma é mais poderoso do que correr.","outro":"Quando o vulcão se acalma, a sétima estrela aparece sobre a lava. O vento frio anuncia o Reino de Gelo.","quests":[["O chão quente","Pedras avermelhadas formam uma trilha instável.","Encontre um caminho seguro.","A trilha fica firme."],["As válvulas antigas","Válvulas esquecidas regulam o calor dos túneis.","Abra as válvulas certas.","A temperatura começa a cair."],["Téo precisa de ajuda","Téo precisa recuperar ferramentas espalhadas pela caverna.","Ajude Téo a consertar a máquina.","A máquina volta a funcionar."],["O coração de fogo","O núcleo do vulcão precisa de uma sequência especial.","Ative o resfriamento.","O vulcão perde a força."],["A estrela rubra","O último brilho está guardado entre pedras de lava.","Recupere a estrela rubra.","A sétima estrela encontra seu lugar no Atlas."]]},{"character":"Nina, a foca","face":"🦭","subtitle":"Um reino preso no inverno","intro":"O Reino de Gelo parece ter parado no tempo. Nina, uma pequena foca, conta que a Bruma congelou os sinos da cidade. Para acordá-los, será preciso superar os desafios do oito.","line":"Cada resposta é uma faísca de calor para este reino.","outro":"Os sinos tocam novamente e a oitava estrela brilha no céu azul. A luz aponta para um conjunto de ilhas flutuantes.","quests":[["O porto congelado","Os barcos estão cercados por pequenos blocos de gelo.","Abra o caminho do porto.","Um canal de água aparece."],["A ponte de neve","A passagem até o vilarejo desapareceu sob a neve.","Revele a ponte de neve.","Os moradores podem atravessar."],["O trenó de Nina","Nina procura seu trenó perdido entre icebergs.","Encontre o trenó de Nina.","Nina entra para o grupo de amigos."],["A torre dos sinos","O relógio de gelo esconde a ordem dos sinos.","Reorganize os sinos do reino.","As torres começam a despertar."],["A primavera do gelo","A estrela está presa no centro do lago congelado.","Aqueça o coração do lago.","A oitava estrela ilumina a paisagem."]]},{"character":"Cora, a nuvem","face":"☁️","subtitle":"Pontes acima das nuvens","intro":"Lá no alto, ilhas suspensas trocam de lugar conforme o vento sopra. Cora, uma nuvenzinha brincalhona, ensina a reconhecer padrões de nove para manter os caminhos no céu.","line":"Quando você observa o padrão, o desafio fica menor.","outro":"A nona estrela desenha um arco-íris no céu. A próxima parada é uma fortaleza de piratas que esconde a décima estrela.","quests":[["O primeiro salto","Plataformas flutuantes precisam se alinhar para a travessia.","Alinhe as plataformas.","Uma ponte de vento aparece."],["A rosa dos ventos","O vento embaralhou as direções do mapa celeste.","Encontre o vento correto.","A bússola volta a girar."],["A nuvem Cora","Cora precisa recuperar gotas brilhantes espalhadas pelo céu.","Ajude Cora a recuperar as gotas.","Cora vira sua nova companheira."],["A tempestade calma","Uma tempestade impede o avanço até a ilha central.","Acalme a tempestade.","O céu finalmente se abre."],["O arco-íris perdido","O arco-íris está sem suas cores mais importantes.","Restaure as cores do arco-íris.","A nona estrela acende o céu."]]},{"character":"Capitã Maré","face":"🏴‍☠️","subtitle":"Piratas que guardam um segredo","intro":"A Fortaleza Pirata protege a última estrela conhecida. A Capitã Maré não quer batalha: ela desafia visitantes a provar que sabem contar de dez em dez.","line":"Quem pensa bem encontra tesouros que ninguém consegue roubar.","outro":"A décima estrela se junta às demais. Nilo revela uma surpresa: faltam ainda duas estrelas escondidas nos lugares da memória!","quests":[["A bandeira do porto","Bandeiras coloridas mostram a rota para a fortaleza.","Decifre as bandeiras.","O portão do porto se abre."],["Canhões de confete","Os piratas testam canhões que soltam confetes, não balas.","Organize os canhões festivos.","O pátio vira uma festa."],["O grumete perdido","Um jovem grumete não consegue encontrar sua tripulação.","Ajude o grumete a voltar.","A tripulação agradece a ajuda."],["A sala do tesouro","Um grande cofre protege um mapa raro.","Abra o cofre da capitã.","Dentro do cofre está a rota final."],["O acordo dos piratas","A Capitã Maré ofe const START_PROFILES=[{id:'alana',name:'Alana',avatar:'👩🏽‍🚀'},{id:'tais',name:'Taís',avatar:'🧙🏽‍♀️'},{id:'heloisa',name:'Heloísa',avatar:'🦸🏽‍♀️'}];
function fresh(){return {profiles:START_PROFILES.map(p=>({...p,done:[],gold:0,gems:0,pets:[],mistakes:{}})),activeId:null,calm:false,sound:false};}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x && Array.isArray(x.profiles)){return {...fresh(),...x};}}catch(e){}return fresh();}
let mission=null,db=load(),screen=db.activeId?'world':'profiles',selectedRegion=0,quiz=null,celebration=null,feedback=null,showHint=false,lastFactKey=null,toastTimer=null;
let collectionTab='chests';
const root=document.getElementById('root');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>db.profiles.find(p=>p.id===db.activeId)||null;
function sceneArt(id,extraClass='tq-scene'){
  // Imagens geradas permanecem como arquivos locais WebP.
  // Regiões sem pintura definitiva continuam usando a ilustração SVG anterior.
  const pictures={0:'beach',1:'forest',11:'candy','mascot-nilo':'nilo','treasure-chest':'chest'};
  const file=pictures[id];
  if(file){
    const sizes=file==='nilo'?'width="610" height="813"':file==='chest'?'width="600" height="600"':'width="1080" height="810"';
    return `<img class="${extraClass} game-artwork" src="./assets/artwork/${file}.webp" ${sizes} alt="" loading="lazy" decoding="async">`;
  }
  const key=typeof id==='number'?'scene-'+id:String(id);
  return `<svg class="${extraClass}" viewBox="0 0 600 360" aria-hidden="true" focusable="false"><use href="./assets/atlas-scenes.svg#${key}"></use></svg>`;
}
db.profiles.forEach(Rewards.ensure);
save();
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));}catch(e){notify('Armazenamento indisponível. O progresso pode não ser salvo.');}}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700);}
function completedCount(p,r){return Array.from({length:5},(_,i)=>`${r}-${i}`).filter(k=>p.done.includes(k)).length;}
function unlockedRegion(p){for(let r=0;r<REGIONS.length;r++)if(completedCount(p,r)<5)return r;return 12;}
const worldDone=p=>p.done.length>=60;
const progress=p=>Math.round((p.done.length/60)*100);
function playSound(hz=650){if(!db.sound)return;try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ac=new AudioCtx(),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(hz,ac.currentTime);g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.17);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18);o.onended=()=>ac.close();}catch(e){}}
function mobileHeader(p) {
  const current=unlockedRegion(p);
  const where=worldDone(p)?'Mundo concluído':`Região ${Math.min(current+1,12)} de 12`;

}
function mobileBottomNav() {
  if (screen==='quiz'||screen==='prologue'||screen==='profiles') return '';

  const tabs=[['world','home','🗺️','Mapa'],['collection','openCollection','🎒','Coleção'],['book','openBook','📖','Diário'],['profile','openProfile','👧','Perfil']];

}
function shell(inner){const p=active();document.body.classList.toggle('calm',db.calm);if(!p){root.innerHTML=inner;return;}root.innerHTML=`${mobileHeader(p)}<div class="layout"><aside class="aside"><div class="panel profile-panel"><div class="profile-top"><span class="overline">Exploradora do Atlas</span></div><div class="profile-avatar" aria-hidden="true">${escapeHTML(p.avatar)}</div><div class="tq-side-pet">${p.equipped.pet==='nilo'?sceneArt('mascot-nilo'):`<span class="tq-pet-emoji">${CHAPTERS[Number(p.equipped.pet.slice(4))]?.face||'🐾'}</span>`}</div><div class="tq-equipped">${p.equipped.cosmetic?(Rewards.CATALOG.find(x=>x.id===p.equipped.cosmetic)?.symbol||'✨')+' '+escapeHTML(Rewards.CATALOG.find(x=>x.id===p.equipped.cosmetic)?.name||''):`🐾 ${p.equipped.pet==='nilo'?'Nilo, o cartógrafo':escapeHTML(CHAPTERS[Number(p.equipped.pet.slice(4))]?.character||'Meu amigo')}`}</div><div><div class="profile-name">${escapeHTML(p.name)}</div><div class="profile-sub">${worldDone(p)?'Exploradora lendária!':'Capítulo '+(Math.min(unlockedRegion(p)+1,12))+' de 12'}</div></div><div class="separator"></div><div class="statline"><span>🗺️ Mundo explorado</span><b>${progress(p)}%</b></div><div class="meter" aria-label="${progress(p)} por cento do mundo explorado"><span style="width:${progress(p)}%"></span></div><div class="statline"><span>🧩 Fases concluídas</span><b>${p.done.length} / 60</b></div><div class="treasure"><div><b>🪙 ${p.gold}</b><small>Moedas de ouro</small></div><div><b>💎 ${p.gems}</b><small>Gemas</small></div></div><div class="statline" style="margin-bottom:0"><span>🐾 Amigos encontrados</span><b>${p.pets.length} / 12</b></div></div><div class="panel settings"><div class="tq-sidebar-actions"><button class="btn btn-primary" data-action="openCollection">🎒 Minha coleção</button><button class="btn btn-ghost" data-action="home">🗺️ Mapa do mundo</button></div><div class="overline">Preferências</div><div class="settingrow"><button type="button" data-action="toggleCalm" aria-pressed="${db.calm}" title="Reduzir movimento">🌿 <span class="sr-only">Modo calmo</span><span class="switch ${db.calm?'on':''}" aria-hidden="true"></span></button></div><div class="settingrow"><button type="button" data-action="toggleSound" aria-pressed="${db.sound}" title="Som ligado ou desligado">${db.sound?'🔊':'🔇'} <span class="sr-only">Efeitos sonoros</span></button></div><p class="settingsnote">Sem cronômetro e sem perder pontos quando errar.</p></div></aside><main class="main">${inner}</main></div>${mobileBottomNav()}`;}
function renderProfiles(){const pCards=db.profiles.map(p=>`<button type="button" class="pick" data-action="chooseProfile" data-id="${escapeHTML(p.id)}"><span class="avatar">${escapeHTML(p.avatar)}</span><b>${escapeHTML(p.name)}</b><small>${p.done.length} de 60 ilhas</small></button>`).join('');shell(`<div class="panel profile-cover"><div class="eyebrow">Bem-vindas a bordo</div><h1>Quem vai explorar hoje?</h1><p>Cada aventureira tem seu próprio mapa, tesouros e progresso. Escolha um perfil para começar.</p></div><div class="profile-picker">${pCards}</div><form class="newprofile" id="newProfileForm"><label for="newName" class="sr-only">Nome da nova aventureira</label><input id="newName" name="name" maxlength="24" placeholder="Nome de outro explorador" required/><button class="btn btn-secondary" type="submit">+ Criar perfil</button></form><p class="footnote">Não é necessário criar uma conta. O progresso permanece neste navegador.</p>`);}
function storyProgress(p){return Math.min(12,Math.floor(p.done.length/5));}
function revealChapter(p,r){return r<=unlockedRegion(p);}
function renderPrologue(){const p=active();shell(`<div class="story-canvas"><span class="eyebrow">Prólogo · O mistério do Grande Atlas</span><div class="prologue-art illustrated-guide" aria-hidden="true">${sceneArt("mascot-nilo","guide-prologue")}</div><h1>As doze estrelas desapareceram!</h1><p>Era uma vez um atlas mágico que guardava todos os caminhos do mundo. Uma névoa chamada <strong>Bruma do Esquecimento</strong> espalhou suas doze estrelas e deixou ilhas, florestas e montanhas sem direção.</p><p><strong>${escapeHTML(p.name)}</strong>, a coruja Nilo precisa da sua ajuda. Cada região esconde uma estrela. Resolva os desafios, faça novos amigos e devolva as cores ao mapa!</p><div class="story-quote"><div class="character-face">🦉</div><div><b>Nilo, o cartógrafo</b><p>“Não é preciso correr nem acertar tudo de primeira. O segredo é continuar descobrindo!”</p></div></div><div class="story-controls"><button class="btn btn-ghost" data-action="home">Ver o mapa</button><button class="btn btn-primary" data-action="beginJourney">Começar a aventura →</button></div></div>`);}
function renderBook(){const p=active(),u=unlockedRegion(p);const items=CHAPTERS.map((c,i)=>{const r=REGIONS[i],count=completedCount(p,i),locked=i>u;return `<article class="book-entry ${locked?'book-locked':''}"><div class="book-icon">${locked?'🔒':r.icon}</div><div><span class="overline">Capítulo ${String(i+1).padStart(2,'0')} · ${locked?'Ainda não descoberto':count===5?'Estrela recuperada':'Em andamento'}</span><h3>${locked?'Uma página escondida':r.name}</h3><p>${locked?'Continue a aventura para descobrir essa história.':count===5?c.outro:c.intro}</p>${locked?'':`<button class="btn btn-secondary btn-small" data-action="openRegion" data-region="${i}">${count===5?'Rever o capítulo':'Continuar este capítulo'} →</button>`}</div></article>`;}).join('');shell(`<div class="quiz-header"><button class="btn btn-ghost btn-small" data-action="home">← Voltar ao mapa</button><span class="crumb">${storyProgress(p)} / 12 estrelas</span></div><section class="storybook-heading"><span class="eyebrow">Biblioteca de aventuras</span><h1>Diário do Grande Atlas</h1><p>Acompanhe a história da jornada. As páginas novas aparecem quando você descobre outras regiões.</p><div class="star-counter">${Array.from({length:12},(_,i)=>`<span aria-label="Estrela ${i+1}: ${i<storyProgress(p)?'recuperada':'não recuperada'}" class="${i<storyProgress(p)?'lit':''}">${i<storyProgress(p)?'⭐':'☆'}</span>`).join('')}</div></section><section class="book-list">${items}</section>`);}
function renderMissionStory(){const p=active();if(!mission){screen='region';render();return;}const {r,island}=mission,c=CHAPTERS[r],m=c.quests[island];if(r>unlockedRegion(p)||island!==completedCount(p,r)){screen='region';render();return;}shell(`<div class="quiz-header"><button class="btn btn-ghost btn-small" data-action="backToRegion">← Voltar ao capítulo</button><span class="crumb">Capítulo ${r+1} · Fase ${island+1} de 5</span></div><section class="mission-story"><div class="mission-header"><span class="eyebrow">${REGIONS[r].name} · Missão ${island+1}</span><span class="mission-symbol">${ISLAND_ICONS[island]}</span></div><h1>${m[0]}</h1><div class="mission-scene">${sceneArt(r,'mission-scene-art')}<p>${m[1]}</p></div><div class="mission-objective"><span aria-hidden="true">🎯</span><div><b>Seu objetivo</b><p>${m[2]}</p></div></div><div class="character-talk"><span class="character-face">${c.face}</span><div><b>${c.character}</b><p>“${c.line}”</p></div></div><div class="story-controls"><button class="btn btn-ghost" data-action="backToRegion">Voltar</button><button class="btn btn-primary" data-action="beginMission">Resolver desafios →</button></div><p class="footnote">8 multiplicações, duas respostas certas para cada uma. Sem tempo limite, sem perder moedas ao errar.</p></section>`);}

function regionHTML(p,r,unlocked){
  const t=REGIONS[r],count=completedCount(p,r),locked=r>unlocked,done=count===5,cur=r===unlocked;
  const desc=locked?'Um novo lugar espera por você':done?'Sua estrela ilumina este destino':t.desc;
  const status=locked?'Mistério por revelar':done?'Estrela conquistada':'Sua próxima aventura';
  const statusIcon=locked?'🔒':done?'⭐':'✦';
  return `<div class="journey-stop ${locked?'locked':done?'complete':'current'}"><button type="button" class="region-card journey-card ${locked?'locked':''} ${done?'complete':''} ${cur?'current':''}" data-action="openRegion" data-region="${r}" ${locked?'disabled':''} aria-label="Capítulo ${r+1}: ${t.name}, ${locked?'bloqueado':done?'concluído':count+' de 5 fases'}">
    <span class="journey-art" aria-hidden="true">${sceneArt(r)}</span>
    <span class="journey-mist" aria-hidden="true"></span>
    <span class="journey-topline"><span class="journey-chapter">CAPÍTULO ${String(r+1).padStart(2,'0')}</span><span class="journey-state">${statusIcon} ${locked?'Secreto':done?'Conquistado':'Explorar'}</span></span>
    <span class="journey-bottom">
      <span class="journey-detail">${t.table?'TABUADA DO '+t.table:'DESAFIO DE REVISÃO'}</span>
      <span class="journey-name">${t.name}</span>
      <span class="journey-description">${desc}</span>
      <span class="journey-footer"><span class="journey-status">${status}</span><span class="journey-action" aria-hidden="true">${locked?'✧':done?'✓':'➜'}</span></span>
      <span class="journey-dots" aria-hidden="true">${Array.from({length:5},(_,i)=>`<span class="${i<count?'lit':''}"></span>`).join('')}</span>
    </span>
  </button></div>`;
}
function renderWorld(){const p=active(),unlocked=unlockedRegion(p),t=REGIONS[Math.min(unlocked,11)],all=worldDone(p),ch=CHAPTERS[Math.min(unlocked,11)],stars=storyProgress(p);shell(`<section class="hero hero-illustrated"><span class="eyebrow">O grande atlas · ${stars} de 12 estrelas</span><h1>${all?'O Atlas voltou a brilhar!':'As estrelas do mundo precisam de você.'}</h1><p>${all?'As doze estrelas voltaram a brilhar e todas as páginas do Atlas foram recuperadas.':`Próximo capítulo: <strong>${t.name}</strong>. ${ch.subtitle}. Descubra o que aconteceu e ajude os amigos da expedição.`}</p><div class="hero-buttons"><button class="btn btn-primary" data-action="${all?'viewVictory':'openRegion'}" data-region="${Math.min(unlocked,11)}">${all?'🏆 Ver grande final':'📖 Continuar história'} →</button><button class="btn btn-ghost" data-action="openBook">📚 Diário</button></div>${sceneArt(Math.min(unlocked,11),'hero-scene')}<span class="hero-sparkle" aria-hidden="true">✦ ✧ ✦</span></section><div class="atlas-banner"><div class="atlas-banner-title"><span class="eyebrow">O Grande Atlas</span><b>Recupere as 12 estrelas</b></div><div class="atlas-stars">${Array.from({length:12},(_,i)=>`<span title="${i<stars?'Estrela recuperada':'Estrela ainda escondida'}">${i<stars?'⭐':'✧'}</span>`).join('')}</div></div><div class="section-head journey-section-head"><div><span class="eyebrow">✧ As páginas do Atlas</span><h2>Sua grande jornada</h2><p>Descubra novos mundos. Cada estrela nasce de cinco missões.</p></div><span class="chip">${p.done.length} / 60 fases</span></div><section class="worldmap journey-worldmap" aria-label="Mapa de capítulos"><div class="journey-map-heading"><span class="journey-map-emblem" aria-hidden="true">✦</span><div><strong>O caminho das 12 estrelas</strong><small>${all?'Todos os destinos foram revelados!':'Seu próximo destino está brilhando.'}</small></div><span class="journey-map-total">${stars}/12 <span aria-hidden="true">⭐</span></span></div><div class="region-grid jour function renderRegion(){const p=active(),r=selectedRegion,t=REGIONS[r],c=CHAPTERS[r],count=completedCount(p,r),unlocked=unlockedRegion(p);if(r>unlocked){screen='world';render();return;}const islands=c.quests.map((m,i)=>{const done=p.done.includes(`${r}-${i}`),isCurrent=!done&&i===count,locked=i>count;const reward=i===2?'🐾 Novo amigo':i===3?'🎁 Baú encantado':i===4?'⭐ Relíquia + estrela':i===1?'💎 Gemas':'🪙 Tesouro';return `<button type="button" class="island ${done?'done':isCurrent?'current':'locked'}" data-action="openMission" data-island="${i}" ${done||locked?'disabled':''} aria-label="Fase ${i+1}: ${m[0]}, ${done?'concluída':locked?'bloqueada':'disponível'}"><span class="circle">${done?'✅':isCurrent?ISLAND_ICONS[i]:'🔒'}</span><span class="island-title">${m[0]}</span><span class="island-detail">${done?'Concluída':locked?'Ainda bloqueada':isCurrent?'Próxima missão':''}</span><span class="badge-mini">${done?'Conquistada':reward}</span></button>`;}).join('');shell(`<div class="quiz-header"><button class="btn btn-ghost btn-small" data-action="home">← Mapa do mundo</button><span class="crumb">Capítulo ${r+1} de 12</span></div><section class="panel islandhero"><div class="big-emoji" aria-hidden="true">${sceneArt(r)}</div><div><div class="eyebrow">${t.theme} · ${t.table?'Tabuada do '+t.table:'Revisão'}</div><h1>${t.name}</h1><p>${c.subtitle}</p></div></section><section class="chapter-story"><div class="chapter-story-top"><span class="eyebrow">A história deste capítulo</span><span class="chapter-tag">${count===5?'⭐ Estrela recuperada':`📖 ${count}/5 fases`}</span></div><p>${c.intro}</p><div class="character-talk"><span class="character-face">${c.face}</span><div><b>${c.character}</b><p>“${c.line}”</p></div></div>${count===5?`<div class="chapter-outro"><b>✨ Final deste capítulo</b><p>${c.outro}</p></div>`:''}</section><div class="section-head"><div><span class="eyebrow">A rota da aventura</span><h2>Cinco fases, uma estrela</h2><p>Escolha a fase destacada para descobrir o próx function mulKey(a,b){return `${a}x${b}`;}
function seededShuffle(arr,seed){const result=arr.slice();let state=seed>>>0;for(let i=result.length-1;i>0;i--){state=(Math.imul(state,1664525)+1013904223)>>>0;let j=state%(i+1);[result[i],result[j]]=[result[j],result[i]];}return result;}
function buildFacts(r,island){if(r<10){const t=r+1;return Array.from({length:8},(_,x)=>({a:t,b:((x+island*2)%10)+1,key:mulKey(t,((x+island*2)%10)+1)}));}const start=r===10?1:6,base=[];for(let a=start;a<start+5;a++)for(let b=1;b<=10;b++)base.push({a,b,key:mulKey(a,b)});const stats=active()?.factStats||{};return seededShuffle(base,9271+r*423+island*109).sort((a,b)=>(stats[b.key]?.errors||0)-(stats[a.key]?.errors||0)).slice(0,8);}
function selectNext(){if(!quiz)return;const min=Math.min(...quiz.facts.map(f=>quiz.counts[f.key]));if(min>=2){finishIsland();return;}let choices=quiz.facts.filter(f=>quiz.counts[f.key]===min);if(choices.length>1)choices=choices.filter(f=>f.key!==lastFactKey);const pick=choices[Math.floor(Math.random()*choices.length)];quiz.fact=pick;lastFactKey=pick.key;quiz.options=makeOptions(pick.a,pick.b);feedback=null;showHint=false;render();}
function makeOptions(a,b){const result=a*b;const candidate=[a*(b+1),a*(b-1),result+a,result-a,result+b,result-b,result+10,result-10,a+b,a*b+1,a*b-1,result+2,result-2];const options=[result];for(const v of seededShuffle(candidate,(a*1009+b*71+Date.now())>>>0)){if(v>=0&&v<=100&&!options.includes(v))options.push(v);if(options.length===4)break;}let n=1;while(options.length<4){if(!options.includes(n))options.push(n);n++;}return seededShuffle(options,(a*113+b*917+Math.floor(Math.random()*100000))>>>0);}
function startIsland(island){const p=active(),r=selectedRegion,unlocked=unlockedRegion(p);if(r>unlocked||island!==completedCount(p,r)||p.done.includes(`${r}-${island}`))return;quiz={r,island,facts:buildFacts(r,island),counts:{},fact:null,options:[],attempts:0,errors:0,locked:false};quiz.facts.forEach(f=>quiz.counts[f.key]=0);screen='quiz';lastFactKey=null;selectNext();}
function hintHTML(a,b){let dots=Array.from({length:a},()=>`<span class="groupdots" aria-label="Grupo com ${b} pontos">${Array.from({length:b},()=>'<span aria-hidden="true"></span>').join('')}</span>`).join('');return `<div class="hint"><h3>🧠 Pense em grupos iguais</h3><p><strong>${a} × ${b}</strong> significa ${a} ${a===1?'grupo':'grupos'} com ${b} ${b===1?'elemento':'elementos'} em cada. Conte os pontinhos!</p><div class="groups">${dots}</div></div>`;}
function renderQuiz(){if(!quiz){screen='world';render();return;}const f=quiz.fact,correctCount=Object.values(quiz.counts).reduce((sum,n)=>sum+n,0),percent=Math.round(correctCount/16*100),m=CHAPTERS[quiz.r].quests[quiz.island];shell(`<div class="quiz-screen"><div class="quiz-header"><button class="btn btn-ghost btn-small" data-action="leaveQuiz">← Sair da fase</button><span class="crumb">Capítulo ${quiz.r+1} · Fase ${quiz.island+1}/5</span></div><div class="mission-brief"><span aria-hidden="true">${REGIONS[quiz.r].icon}</span><div><strong>${m[0]}</strong><small>🎯 ${m[2]}</small></div></div><div class="panel quiz-panel"><div class="quiz-top"><span>⭐ Desafio ${correctCount+1} de 16</span><span>${percent}% concluído</span></div><div class="quiz-meter" role="progressbar" aria-valuemin="0" aria-valuemax="16" aria-valuenow="${correctCount}" aria-label="Progresso da fase"><span style="width:${percent}%"></span></div><div class="question-box"><div class="question-label">Quanto é?</div><div class="sum">${f.a} × ${f.b} = ?</div><p class="subline">Resolva no seu ritmo. A aventura continua! ✨</p></div>${quiz.counts[f.key]===0?`<div class="answer-grid">${quiz.options.map((v,i)=>`<button type="button" class="answer ${feedback&&feedback.answer===v?(feedback.correct?'correct':'wrong'):''} ${quiz.locked&&v!==f.a*f.b?'dim':''}" data-action="answer" data-value="${v}" ${quiz.locked?'disabled':''} aria-label="Opção ${i+1}: ${v}">${v}</button>`).join('')}</div>`:`<form class="typed-answer" id="typedAnswerForm"><label for="typedResult">🧠 Agora sem alternativas. Qual é o resultado?</label><div class="typed-row"><input id="typedResult" name="result" type="number" inputmode="numeric" min="0" max="100" placeholder="Digite o resultado" autocomplete="off" required autofocus ${quiz.locked?"disabled":""} /><button class="btn btn-primary" type="submit" ${quiz.locked?"disabled":""}>Conferir ✓</button></div></form>`}${feedback?`<div class="feedback ${feedback.correct?'':'error'}" role="status"><span class="face">${feedback.correct?'🌟':'💛'}</span><span>${feedback.correct?(quiz.counts[f.key]===2?'Muito bem! Você aprendeu esta conta!':'Acertou! Continue assim!'):`Ainda não. Tente de novo! Pense em ${f.a} grupos de ${f.b}.`}</span></div>`:''}${!quiz.locked?`<button class="hinttoggle" data-action="hint">${showHint?'Ocultar dica':'💡 Preciso de uma dica'}</button>`:''}${showHint?hintHTML(f.a,f.b):''}${quiz.locked?`<div class="quiz-actions"><button class="btn btn-primary" data-action="nextQuestion" autofocus>Continuar →</button></div>`:''}<p class="footnote">${quiz.counts[f.key]===0?"No computador, use as teclas 1, 2, 3 ou 4 para escolher.":"Sem alternativas, pense na multiplicação e digite o resultado."}</p></div></div>`);}
function answer(value){if(!quiz||quiz.locked||screen!=='quiz')return;const correct=value===quiz.fact.a*quiz.fact.b;quiz.attempts++;const player=active();if(player){player.factStats??={};const stat=player.factStats[quiz.fact.key]??{correct:0,errors:0,hints:0};if(correct)stat.correct++;else stat.errors++;if(showHint)stat.hints++;player.factStats[quiz.fact.key]=stat;save();}if(correct){quiz.counts[quiz.fact.key]++;quiz.locked=true;feedback={answer:value,correct:true};playSound(790);}else{quiz.errors++;feedback={answer:value,correct:false};showHint=true;playSound(280);}render();}
function finishIsland(){const p=active(),{r,island,errors}=quiz,key=`${r}-${island}`;if(!p.done.includes(key)){p.done.push(key);const gold=island===4?70:25+(r*3);p.gold+=gold;const gems=island===1?4:0;p.gems+=gems;if(island===2){p.pets.push(r);const petId='pet-'+r;p.inventory??=[];if(!p.inventory.includes(petId))p.inventory.push(petId);}p.mistakes[key]=errors;const bonus=Rewards.grantStage(p,r,island);save();celebration={r,island,gold,gems,pet:island===2,regionComplete:island===4,worldComplete:worldDone(p),chestUnlocked:bonus.chest,relicUnlocked:bonus.relic,errors};}quiz=null;feedback=null;screen='success';playSound(900);render();}

 <p class="footnote">🔐 O progresso de ${escapeHTML(p.name)} fica salvo somente neste navegador. Ele não sincroniza automaticamente entre aparelhos.</p>`);
}
function render(){window.scrollTo(0,0);document.body.classList.toggle('is-quiz',screen==='quiz');document.body.classList.toggle('is-prologue',screen==='prologue');if(screen==='profiles'){renderProfiles();return;}if(!active()){screen='profiles';renderProfiles();return;}if(screen==='prologue')renderPrologue();else if(screen==='world')renderWorld();else if(screen==='region')renderRegion();else if(screen==='book')renderBook();else if(screen==='collection')renderCollection();else if(screen==='profile')renderProfileScreen();else if(screen==='mission')renderMissionStory();else if(screen==='quiz')renderQuiz();else if(screen==='success')renderSuccess();else if(screen==='victory')renderVictory();else{screen='world';renderWorld();}}
function navigate(action,data={}){const p=active();switch(action){
case 'home':quiz=null;mission=null;screen=p?'world':'profiles';break;
case 'switchProfile':quiz=null;mission=null;db.activeId=null;save();screen='profiles';break;
case 'chooseProfile':if(db.profiles.some(x=>x.id===data.id)){db.activeId=data.id;const chosen=active();screen=chosen.done.length===0&&!chosen.prologueSeen?'prologue':'world';save();}break;
case 'beginJourney':if(p){p.prologueSeen=true;save();selectedRegion=0;screen='region';}break;
case 'openBook':quiz=null;mission=null;screen='book';break;
case 'openCollection':if(!p)return;quiz=null;mission=null;collectionTab='chests';screen='collection';break;
case 'collectionTab':{if(!p||screen!=='collection')return;const next=String(data.tab);if(!['chests','pets','relics','shop'].includes(next))return;collectionTab=next;renderCollection();const selected=document.getElementById('tab-'+next);selected?.focus({preventScroll:true});return;}
case 'openProfile':if(!p)return;quiz=null;mission=null;screen='profile';break;
case 'openChest':{if(!p||screen!=='collection')return;const prize=Rewards.openChest(p,String(data.id));if(prize.ok){save();notify('🎁 +'+prize.gold+' moedas, +'+prize.gems+' cristais e uma figurinha!');playSound(940);}else notify(prize.reason);break;}
case 'buyReward':{if(!p||screen!=='collection')return;const result=Rewards.purchase(p,String(data.id));if(result.ok){save();notify('✨ '+result.item.name+' desbloqueado e equipado!');playSound(810);}else notify(result.reason);break;}
case 'equipReward':{if(!p||screen!=='collection')return;const result=Rewards.equip(p,String(data.id));if(result.ok){save();notify('✨ Item equipado!');}else notify(result.reason);break;}
case 'openRegion':{const r=Number(data.region);if(!p||!Number.isInteger(r)||r<0||r>=REGIONS.length||r>unlockedRegion(p))return;selectedRegion=r;quiz=null;mission=null;screen='region';break;}
case 'nextRegion':if(p&&completedCount(p,selectedRegion)===5){selectedRegion=Math.min(selectedRegion+1,11);screen=worldDone(p)?'victory':'region';}break;
case 'openMission':{const i=Number(data.island);if(!p||!Number.isInteger(i)||i<0||i>4||selectedRegion>unlockedRegion(p)||i!==completedCount(p,selectedRegion))return;mission={r:selectedRegion,island:i};screen='mission';break;}
case 'backToRegion':mission=null;screen='region';break;
case 'beginMission':if(!mission||mission.r!==selectedRegion||mission.island!==completedCount(p,selectedRegion))return;startIsland(mission.island);return;
case 'startIsland':{const i=Number(data.island);if(!p||!Number.isInteger(i)||i<0||i>4)return;mission={r:selectedRegion,island:i};startIsland(i);return;}
case 'answer':answer(Number(data.value));return;
case 'nextQuestion':if(!quiz||!quiz.locked)return;quiz.locked=false;selectNext();return;
case 'hint':showHint=!showHint;break;
case 'leaveQuiz':if(quiz){quiz=null;notify('Fase não concluída: as continhas dessa fase recomeçarão.');}screen='region';break;
case 'toggleCalm':db.calm=!db.calm;save();break;
case 'toggleSound':db.sound=!db.sound;save();if(db.sound)playSound();break;
case 'continueAfterWin':{const c=celebration;if(!c)return;if(c.worldComplete)screen='victory';else if(c.regionComplete){selectedRegion=Math.min(c.r+1,11);screen='region';}else{selectedRegion=c.r;mission={r:c.r,island:c.island+1};screen='mission';}break;}
case 'viewVictory':screen='victory';break;
default:return;
}render();}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;e.preventDefault();navigate(btn.dataset.action,btn.dataset);});
document.addEventListener('submit',e=>{if(e.target.id==='typedAnswerForm'){e.preventDefault();if(!quiz||quiz.locked)return;const raw=String(e.target.elements.result.value??'').trim();if(raw)answer(Number(raw));return;}if(e.target.id!=='newProfileForm')return;e.preventDefault();const inp=e.target.elements.name;const name=String(inp.value||'').trim();if(!name)return;if(db.profiles.length>=10){notify('Limite de 10 perfis neste dispositivo.');return;}const id='player-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5);db.profiles.push(Rewards.ensure({id,name:name.slice(0,24),avatar:'🧑‍🚀',done:[],gold:0,gems:0,pets:[],mistakes:{}}));db.activeId=id;save();screen='world';render();});
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLElement&&['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(screen==='quiz'&&quiz){if(quiz.locked&&e.key==='Enter'){e.preventDefault();navigate('nextQuestion');}else if(!quiz.locked&&['1','2','3','4'].includes(e.key)){e.preventDefault();answer(quiz.options[Number(e.key)-1]);}}});
render();
})();
</script>
</body>
