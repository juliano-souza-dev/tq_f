 <script type="module">
 if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(error=>console.warn('PWA indisponível:',error)));
 }
 try{
  await import('./src/app/app.mjs?v=20261023-rewards');
 }catch(error){
  console.error('Falha ao iniciar Tabuada Quest:',error);
  document.getElementById('app').textContent='Não foi possível iniciar o jogo. Verifique a conexão e recarregue.';
 }
 </script>

 <div id="app" aria-live="off">

 </div>
